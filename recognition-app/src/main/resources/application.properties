# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Allow H2 console access (optional, useful for dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate DDL generation
# 'create' will generate the schema on startup.
# 'update' will attempt to update an existing schema.
# 'validate' will validate the schema against entities.
# 'none' will do nothing.
# For capturing DDL, 'create' is suitable.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true # Ensure DDL generation happens

# Show generated SQL in logs
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
